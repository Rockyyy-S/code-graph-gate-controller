name: produce-gate-evidence

on:
  workflow_call:
    inputs:
      base_oid:
        required: true
        type: string
      head_oid:
        required: true
        type: string
      object_format:
        required: true
        type: string
      provider_repository_id:
        required: true
        type: string
      producer_workflow_sha:
        required: true
        type: string
      repository:
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate-execution:
    name: gate-execution-portable
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Validate fixed provider inputs
        env:
          BASE_OID: ${{ inputs.base_oid }}
          HEAD_OID: ${{ inputs.head_oid }}
          OBJECT_FORMAT: ${{ inputs.object_format }}
          PULL_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
          PRODUCER_WORKFLOW_SHA: ${{ inputs.producer_workflow_sha }}
          PROVIDER_REPOSITORY_ID: ${{ inputs.provider_repository_id }}
          REPOSITORY: ${{ inputs.repository }}
        shell: bash
        run: |
          [[ "$BASE_OID" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HEAD_OID" =~ ^[a-f0-9]{40}$ ]]
          [[ "$OBJECT_FORMAT" == "sha1" ]]
          [[ "$PULL_NUMBER" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "$PRODUCER_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PROVIDER_REPOSITORY_ID" == "1303415307" ]]
          [[ "$REPOSITORY" == "Rockyyy-S/code-graph" ]]

      - name: Install checksum-pinned pnpm release
        env:
          PNPM_ARCHIVE_SHA256: dd19bfd8bcd33a3b38dcce335e8d233194c0a61ffe1f5bcf5047f60f6d4978b8 # pnpm v11.12.0 官方 release asset 摘要
          PNPM_ARCHIVE_URL: https://github.com/pnpm/pnpm/releases/download/v11.12.0/pnpm-linux-x64.tar.gz
        shell: bash
        run: |
          archive="$RUNNER_TEMP/pnpm-linux-x64-11.12.0.tar.gz"
          staging="$(mktemp -d "$RUNNER_TEMP/pnpm-11.12.0.XXXXXX")"
          cleanup_pnpm_staging() {
            rm -rf -- "$staging"
            rm -f -- "$archive"
          }
          trap cleanup_pnpm_staging EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 --show-error --silent \
            --output "$archive" "$PNPM_ARCHIVE_URL"
          printf '%s  %s\n' "$PNPM_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$staging" --no-same-owner --no-same-permissions -- pnpm dist
          staging_root="$(realpath -- "$staging")"
          source_pnpm="$(realpath -- "$staging/pnpm")"
          source_dist="$(realpath -- "$staging/dist")"
          [[ -f "$source_pnpm" && ! -L "$source_pnpm" && -s "$source_pnpm" ]]
          [[ "$source_pnpm" == "$staging_root/pnpm" ]]
          [[ -d "$source_dist" && ! -L "$source_dist" && "$source_dist" == "$staging_root/dist" ]]
          [[ -f "$source_dist/pnpm.mjs" && ! -L "$source_dist/pnpm.mjs" ]]
          while IFS= read -r -d '' link; do
            resolved_link="$(realpath -- "$link")"
            case "$resolved_link" in
              "$staging_root"/*) ;;
              *)
                echo "pnpm runtime 符号链接逃离已校验的 staging 目录。" >&2
                exit 1
                ;;
            esac
          done < <(find "$staging_root" -type l -print0)
          [[ ! -e /opt/trusted-pnpm ]]
          sudo install -d -o 0 -g 0 -m 0755 /opt/trusted-pnpm/bin
          sudo cp -a -- "$source_dist" /opt/trusted-pnpm/bin/dist
          sudo install -o 0 -g 0 -m 0755 "$source_pnpm" /opt/trusted-pnpm/bin/pnpm
          sudo chown -R 0:0 /opt/trusted-pnpm
          sudo chmod -R u+rwX,go+rX,go-w /opt/trusted-pnpm
          cleanup_pnpm_staging
          trap - EXIT

      - name: Checkout immutable GateHarness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定 v4 提交
        with:
          fetch-depth: 1
          path: trusted-harness
          persist-credentials: false
          ref: f03e200280d8da8bdd474abe01b9ef2e90f3a631
          repository: Rockyyy-S/code-graph-gate-controller

      - name: Checkout trusted registry state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定 v4 提交
        with:
          fetch-depth: 1
          path: trusted-state
          persist-credentials: false
          ref: main
          repository: Rockyyy-S/code-graph-gate-controller

      - name: Checkout exact candidate OID
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定 v4 提交
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ inputs.head_oid }}
          repository: ${{ inputs.repository }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 固定 v4 提交
        with:
          node-version: 24.18.0

      - name: Prepare isolated candidate identity and artifact directory
        shell: bash
        run: |
          sudo groupadd --gid 20001 gatecandidate
          sudo useradd --uid 20001 --gid 20001 --home-dir /tmp/gatecandidate-home --no-create-home --shell /usr/sbin/nologin gatecandidate
          sudo install -d -o 20001 -g 20001 -m 0700 /tmp/gatecandidate-install-home /tmp/gatecandidate-install-tmp
          install -d -m 0700 artifacts trusted-harness-home

      - name: Verify trusted pnpm for isolated execution
        shell: bash
        run: |
          [[ -f /opt/trusted-pnpm/bin/pnpm && ! -L /opt/trusted-pnpm/bin/pnpm && -x /opt/trusted-pnpm/bin/pnpm ]]
          [[ -f /opt/trusted-pnpm/bin/dist/pnpm.mjs && ! -L /opt/trusted-pnpm/bin/dist/pnpm.mjs ]]
          [[ "$(stat -c '%U:%G %a' /opt/trusted-pnpm/bin/pnpm)" == "root:root 755" ]]
          [[ "$(stat -c '%U:%G' /opt/trusted-pnpm/bin/dist/pnpm.mjs)" == "root:root" ]]
          [[ -z "$(find /opt/trusted-pnpm -perm /022 -print -quit)" ]]
          pnpm_version="$(sudo -u gatecandidate env -i --chdir=/tmp/gatecandidate-install-home \
            HOME=/tmp/gatecandidate-install-home \
            PATH=/opt/trusted-pnpm/bin \
            /opt/trusted-pnpm/bin/pnpm --version)"
          [[ "$pnpm_version" == "11.12.0" ]]

      - name: Install frozen dependencies without candidate lifecycle
        env:
          HEAD_OID: ${{ inputs.head_oid }}
          TRUSTED_PNPM_BIN: /opt/trusted-pnpm/bin
        shell: bash
        run: |
          cleanup_install_identity() {
            sudo pkill -KILL -u 20001 || true
            sudo rm -rf -- /tmp/gatecandidate-install-home /tmp/gatecandidate-install-tmp
          }
          trap cleanup_install_identity EXIT
          workspace_root="$(realpath -- "$GITHUB_WORKSPACE")"
          source_candidate="$(realpath -- candidate)"
          candidate_parent=/tmp/gatecandidate-root
          candidate_root="$candidate_parent/worktree"
          [[ "$source_candidate" == "$workspace_root/candidate" ]]
          [[ -d "$source_candidate/.git" && ! -L "$source_candidate/.git" ]]
          [[ "$(git -C "$source_candidate" rev-parse HEAD)" == "$HEAD_OID" ]]
          [[ "$(realpath -m -- "$candidate_parent")" == "$candidate_parent" && ! -e "$candidate_parent" ]]
          # 父目录保持 root-owned，阻止安装阶段替换固定候选路径。
          sudo install -d -o 0 -g 0 -m 0711 "$candidate_parent"
          sudo install -d -o 20001 -g 20001 -m 0700 "$candidate_root"
          sudo cp -a -- "$source_candidate/." "$candidate_root/"
          sudo chown -R 20001:20001 "$candidate_root"
          [[ "$(sudo git -c safe.directory="$candidate_root" -C "$candidate_root" rev-parse HEAD)" == "$HEAD_OID" ]]
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            CI=true \
            HOME=/tmp/gatecandidate-install-home \
            LANG=C.UTF-8 \
            PATH="$TRUSTED_PNPM_BIN:$PATH" \
            TMPDIR=/tmp/gatecandidate-install-tmp \
            XDG_CACHE_HOME=/tmp/gatecandidate-install-home/.cache \
            XDG_CONFIG_HOME=/tmp/gatecandidate-install-home/.config \
            XDG_DATA_HOME=/tmp/gatecandidate-install-home/.local/share \
            pnpm install --frozen-lockfile --ignore-pnpmfile --ignore-scripts
          # 候选 lifecycle 继续全局禁用；仅对架构锁定且 lockfile integrity 固定的原生依赖执行受控构建。
          [[ "$(grep -Ec '^  better-sqlite3@12\.11\.1:$' "$candidate_root/pnpm-lock.yaml")" -eq 2 ]]
          grep -A2 '^  better-sqlite3@12\.11\.1:$' "$candidate_root/pnpm-lock.yaml" \
            | grep -Fqx '    resolution: {integrity: sha512-dq9AtApgg5PGFtBzPFSBl3HZQjHok5gaQCM6zh2Yk0aSmDCs1CbnVI8/HgASQkNKsWFpseIO9beg5xxpYhbIfA==}'
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            CI=true \
            HOME=/tmp/gatecandidate-install-home \
            LANG=C.UTF-8 \
            PATH="$TRUSTED_PNPM_BIN:$PATH" \
            TMPDIR=/tmp/gatecandidate-install-tmp \
            XDG_CACHE_HOME=/tmp/gatecandidate-install-home/.cache \
            XDG_CONFIG_HOME=/tmp/gatecandidate-install-home/.config \
            XDG_DATA_HOME=/tmp/gatecandidate-install-home/.local/share \
            node --input-type=module --eval \
              'import { readFile } from "node:fs/promises"; const value = JSON.parse(await readFile("packages/adapters/store-sqlite/package.json", "utf8")); if (value?.dependencies?.["better-sqlite3"] !== "12.11.1") process.exit(1);'
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            CI=true \
            HOME=/tmp/gatecandidate-install-home \
            LANG=C.UTF-8 \
            PATH="$TRUSTED_PNPM_BIN:$PATH" \
            TMPDIR=/tmp/gatecandidate-install-tmp \
            XDG_CACHE_HOME=/tmp/gatecandidate-install-home/.cache \
            XDG_CONFIG_HOME=/tmp/gatecandidate-install-home/.config \
            XDG_DATA_HOME=/tmp/gatecandidate-install-home/.local/share \
            pnpm --filter @codegraph/adapter-store-sqlite --fail-if-no-match rebuild better-sqlite3
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            CI=true \
            HOME=/tmp/gatecandidate-install-home \
            LANG=C.UTF-8 \
            PATH="$TRUSTED_PNPM_BIN:$PATH" \
            TMPDIR=/tmp/gatecandidate-install-tmp \
            XDG_CACHE_HOME=/tmp/gatecandidate-install-home/.cache \
            XDG_CONFIG_HOME=/tmp/gatecandidate-install-home/.config \
            XDG_DATA_HOME=/tmp/gatecandidate-install-home/.local/share \
            pnpm --filter @codegraph/adapter-store-sqlite --fail-if-no-match exec \
              node --input-type=module --eval \
              'import Database from "better-sqlite3"; const database = new Database(":memory:"); database.prepare("SELECT 1").get(); database.close();'
          cleanup_install_identity
          trap - EXIT
          # 从候选 UID 无法访问的原 checkout 恢复 Git 元数据，再拒绝任何 tracked 漂移。
          sudo rm -rf -- "$candidate_root/.git"
          sudo cp -a -- "$source_candidate/.git" "$candidate_root/.git"
          [[ ! -e /g ]]
          sudo install -d -o 0 -g 0 -m 0711 /tmp/gatecandidate-home /g
          sudo chown -R "$(id -u):20001" "$candidate_root"
          sudo chmod -R u+rwX,g+rX,o-rwx "$candidate_root"
          [[ "$(sudo git -c safe.directory="$candidate_root" -C "$candidate_root" rev-parse HEAD)" == "$HEAD_OID" ]]
          sudo git -c safe.directory="$candidate_root" -C "$candidate_root" diff --quiet --no-ext-diff HEAD --

      - name: Bootstrap fixed Rust toolchain and locked dependency cache
        env:
          RUST_TOOLCHAIN: 1.88.0
        shell: bash
        run: |
          set -euo pipefail
          candidate_root=/tmp/gatecandidate-root/worktree
          rustup_source="$(realpath -- "$(command -v rustup)")"
          bootstrap_root="$(mktemp -d "$RUNNER_TEMP/trusted-rust-1.88.0.XXXXXX")"
          bootstrap_home="$bootstrap_root/home"
          bootstrap_cargo_home="$bootstrap_root/cargo-home"
          bootstrap_rustup_home="$bootstrap_root/rustup-home"
          cleanup_rust_bootstrap() {
            rm -rf -- "$bootstrap_root"
          }
          trap cleanup_rust_bootstrap EXIT
          [[ -f "$rustup_source" && ! -L "$rustup_source" && -x "$rustup_source" ]]
          install -d -m 0700 "$bootstrap_home" "$bootstrap_cargo_home" "$bootstrap_rustup_home"
          env -i \
            HOME="$bootstrap_home" \
            CARGO_HOME="$bootstrap_cargo_home" \
            LANG=C.UTF-8 \
            PATH="$PATH" \
            RUSTUP_HOME="$bootstrap_rustup_home" \
            "$rustup_source" toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          toolchain_root="$(find "$bootstrap_rustup_home/toolchains" -mindepth 1 -maxdepth 1 -type d -name "$RUST_TOOLCHAIN-*" -print -quit)"
          [[ -n "$toolchain_root" && -x "$toolchain_root/bin/cargo" && -x "$toolchain_root/bin/rustc" ]]
          [[ "$(env -i HOME="$bootstrap_home" LANG=C.UTF-8 PATH="$toolchain_root/bin:/usr/bin:/bin" "$toolchain_root/bin/rustc" --version)" == rustc\ 1.88.0* ]]
          env -i \
            HOME="$bootstrap_home" \
            CARGO_HOME="$bootstrap_cargo_home" \
            LANG=C.UTF-8 \
            PATH="$toolchain_root/bin:/usr/bin:/bin" \
            RUSTUP_HOME="$bootstrap_rustup_home" \
            "$toolchain_root/bin/cargo" fetch --locked --manifest-path "$candidate_root/Cargo.toml"
          env -i \
            HOME="$bootstrap_home" \
            CARGO_HOME="$bootstrap_cargo_home" \
            LANG=C.UTF-8 \
            PATH="$toolchain_root/bin:/usr/bin:/bin" \
            RUSTUP_HOME="$bootstrap_rustup_home" \
            "$toolchain_root/bin/cargo" metadata --locked --offline --format-version 1 \
              --manifest-path "$candidate_root/Cargo.toml" > "$bootstrap_root/metadata.json"
          [[ -s "$bootstrap_root/metadata.json" && -d "$bootstrap_cargo_home/registry" ]]
          [[ ! -e /opt/trusted-rust ]]
          sudo install -d -o 0 -g 0 -m 0755 \
            /opt/trusted-rust/bin /opt/trusted-rust/libexec /opt/trusted-rust/cargo-cache
          sudo cp -a -- "$bootstrap_rustup_home" /opt/trusted-rust/rustup-home
          sudo cp -a -- "$bootstrap_cargo_home/registry" /opt/trusted-rust/cargo-cache/registry
          sudo install -o 0 -g 0 -m 0755 "$rustup_source" /opt/trusted-rust/libexec/rustup
          toolchain_name="$(basename "$toolchain_root")"
          sudo tee /opt/trusted-rust/bin/cargo > /dev/null <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          : "\${HOME:?gate HOME is required}"
          cargo_home="\$HOME/.cargo"
          mkdir -p "\$cargo_home"
          if [[ ! -e "\$cargo_home/registry" ]]; then
            ln -s /opt/trusted-rust/cargo-cache/registry "\$cargo_home/registry"
          fi
          export CARGO_HOME="\$cargo_home"
          export CARGO_TARGET_DIR="\$HOME/.cargo-target"
          export RUSTUP_HOME=/opt/trusted-rust/rustup-home
          export RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN
          export PATH="/opt/trusted-rust/rustup-home/toolchains/$toolchain_name/bin:\$PATH"
          exec /opt/trusted-rust/rustup-home/toolchains/$toolchain_name/bin/cargo "\$@"
          EOF
          sudo tee /opt/trusted-rust/bin/rustup > /dev/null <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          : "\${HOME:?gate HOME is required}"
          export CARGO_HOME="\$HOME/.cargo"
          export RUSTUP_HOME=/opt/trusted-rust/rustup-home
          export RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN
          exec /opt/trusted-rust/libexec/rustup "\$@"
          EOF
          sudo chmod 0755 /opt/trusted-rust/bin/cargo /opt/trusted-rust/bin/rustup
          sudo chown -R 0:0 /opt/trusted-rust
          sudo chmod -R u+rwX,go+rX,go-w /opt/trusted-rust
          [[ -z "$(find /opt/trusted-rust -perm /022 -print -quit)" ]]
          sudo git -c safe.directory="$candidate_root" -C "$candidate_root" diff --quiet --no-ext-diff HEAD --
          cleanup_rust_bootstrap
          trap - EXIT

      - name: Grant candidate writes only to generated output directories
        shell: bash
        run: |
          candidate_root=/tmp/gatecandidate-root/worktree
          [[ -d "$candidate_root" && ! -L "$candidate_root" ]]
          [[ "$(realpath -- "$candidate_root")" == "$candidate_root" ]]
          outputs=(
            apps/cli/dist
            apps/extension/dist
            apps/graph-service/dist
            apps/webview/dist
            packages/adapters/analyzer-typescript/dist
            packages/adapters/git-local/dist
            packages/adapters/host-path-posix-native/dist
            packages/adapters/store-sqlite/dist
            packages/application/dist
            packages/contracts/dist
            packages/domain/dist
            packages/service-client/dist
            node_modules/.vite
          )
          for relative_path in "${outputs[@]}"; do
            output_path="$candidate_root/$relative_path"
            resolved_output="$(realpath -m -- "$output_path")"
            if [[ "$resolved_output" != "$output_path" ]]; then
              echo "拒绝包含符号链接祖先的输出目录：$relative_path" >&2
              exit 1
            fi
            sudo install -d -o 20001 -g 20001 -m 0700 "$output_path"
            sudo chown -R 20001:20001 "$output_path"
            sudo chmod -R u+rwX,go-rwx "$output_path"
            sudo -u gatecandidate test -w "$output_path"
          done
          readonly_paths=(
            Cargo.toml
            apps/graph-service/src/index.ts
            packages/adapters/host-path-posix-native/src/index.ts
          )
          for relative_path in "${readonly_paths[@]}"; do
            readonly_path="$candidate_root/$relative_path"
            [[ -f "$readonly_path" && ! -L "$readonly_path" ]]
            if sudo -u gatecandidate test -w "$readonly_path"; then
              echo "未授权候选源码可写：$relative_path" >&2
              exit 1
            fi
          done

      - name: Create supported btrfs snapshot filesystem
        shell: bash
        run: |
          set -euo pipefail
          for required_tool in /usr/bin/btrfs /usr/bin/findmnt /usr/bin/mount /usr/bin/umount; do
            [[ -f "$required_tool" && ! -L "$required_tool" && -x "$required_tool" ]]
          done
          mkfs_btrfs="$(command -v /usr/sbin/mkfs.btrfs || command -v /usr/bin/mkfs.btrfs)"
          losetup_tool="$(command -v /usr/sbin/losetup || command -v /usr/bin/losetup)"
          truncate_tool="$(command -v /usr/bin/truncate)"
          [[ -f "$mkfs_btrfs" && ! -L "$mkfs_btrfs" && -x "$mkfs_btrfs" ]]
          [[ -f "$losetup_tool" && ! -L "$losetup_tool" && -x "$losetup_tool" ]]
          [[ -f "$truncate_tool" && ! -L "$truncate_tool" && -x "$truncate_tool" ]]
          [[ -d /g && ! -L /g ]]
          ! mountpoint --quiet /g
          gate_image="$RUNNER_TEMP/codegraph-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.btrfs"
          gate_loop=""
          cleanup_failed_filesystem() {
            if mountpoint --quiet /g; then
              sudo /usr/bin/umount -- /g || true
            fi
            if [[ -n "$gate_loop" ]]; then
              sudo "$losetup_tool" --detach "$gate_loop" || true
            fi
            rm -f -- "$gate_image"
          }
          trap cleanup_failed_filesystem EXIT
          [[ ! -e "$gate_image" ]]
          "$truncate_tool" --size 4G "$gate_image"
          gate_loop="$(sudo "$losetup_tool" --find --show "$gate_image")"
          [[ "$gate_loop" =~ ^/dev/loop[0-9]+$ ]]
          sudo "$mkfs_btrfs" --force --label codegraph-gate "$gate_loop"
          sudo /usr/bin/mount -t btrfs -o nosuid,nodev -- "$gate_loop" /g
          gate_filesystem="$(findmnt --noheadings --output FSTYPE --target /g | tr -d '[:space:]')"
          gate_source="$(findmnt --noheadings --output SOURCE --target /g | tr -d '[:space:]')"
          [[ "$gate_filesystem" == "btrfs" ]]
          [[ "$gate_source" == "$gate_loop" ]]
          sudo install -d -o 0 -g 20001 -m 0750 /run/codegraph-host-path
          sudo install -d -o 0 -g 0 -m 0700 /run/codegraph-host-path/snapshots
          printf 'GATE_BTRFS_IMAGE=%s\n' "$gate_image" >> "$GITHUB_ENV"
          printf 'GATE_BTRFS_LOOP=%s\n' "$gate_loop" >> "$GITHUB_ENV"
          printf 'GATE_BTRFS_LOSETUP=%s\n' "$losetup_tool" >> "$GITHUB_ENV"
          printf 'PORTABLE_SNAPSHOT_RUNTIME_READY=true\n' >> "$GITHUB_ENV"
          trap - EXIT

      - name: Provision signed Linux host-path helper runtime
        env:
          HEAD_OID: ${{ inputs.head_oid }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'portable-runtime-proof: snapshot-ready=%s\n' "${PORTABLE_SNAPSHOT_RUNTIME_READY:-unset}"
          if [[ "${PORTABLE_SNAPSHOT_RUNTIME_READY:-}" != "true" ]]; then
            echo "portable-runtime-proof: snapshot-ready: fail" >&2
            exit 1
          fi
          candidate_root=/tmp/gatecandidate-root/worktree
          helper_manifest="$candidate_root/packages/adapters/host-path-posix-native/native/codegraph-host-path-helper/Cargo.toml"
          helper_build_home=/tmp/gatecandidate-helper-build
          material_staging="$(mktemp -d "$RUNNER_TEMP/codegraph-host-path-materials.XXXXXX")"
          cleanup_helper_staging() {
            sudo rm -rf -- "$helper_build_home"
            rm -rf -- "$material_staging"
          }
          trap cleanup_helper_staging EXIT
          sudo install -d -o 20001 -g 20001 -m 0700 "$helper_build_home"
          cargo_messages="$material_staging/cargo-messages.jsonl"
          cargo_stderr="$material_staging/cargo.stderr.log"
          resolved_executables="$material_staging/cargo-executables.json"
          set +e
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            CARGO_NET_OFFLINE=true \
            CI=true \
            HOME="$helper_build_home" \
            LANG=C.UTF-8 \
            PATH=/opt/trusted-rust/bin:/usr/bin:/bin \
            TMPDIR="$helper_build_home" \
            /opt/trusted-rust/bin/cargo build --locked --offline --release \
              --manifest-path "$helper_manifest" \
              --bin codegraph-host-path-bridge \
              --bin codegraph-host-path-daemon \
              --message-format=json-render-diagnostics \
              > "$cargo_messages" 2> "$cargo_stderr"
          cargo_status=$?
          set -e
          if [[ -s "$cargo_stderr" ]]; then
            cat -- "$cargo_stderr" >&2
          fi
          if (( cargo_status != 0 )); then
            CARGO_MESSAGES="$cargo_messages" node --input-type=module <<'CARGO_DIAGNOSTICS' >&2 || true
          import { readFileSync } from "node:fs";

          for (const line of readFileSync(process.env.CARGO_MESSAGES, "utf8").split(/\r?\n/u)) {
            if (line.length === 0) continue;
            try {
              const message = JSON.parse(line);
              if (typeof message?.message?.rendered === "string") {
                process.stderr.write(message.message.rendered);
              }
            } catch {
              // Cargo 的原始退出码仍是失败权威，畸形诊断不得覆盖它。
            }
          }
          CARGO_DIAGNOSTICS
            echo "Cargo helper 构建失败：exit=$cargo_status" >&2
            exit "$cargo_status"
          fi
          printf 'cargo-topology: messages=%s bytes=%s\n' \
            "$cargo_messages" "$(stat -c '%s' -- "$cargo_messages" 2>/dev/null || printf 'unavailable')"
          if [[ ! -s "$cargo_messages" ]]; then
            echo "cargo-topology: messages: fail" >&2
            exit 1
          fi
          CARGO_MESSAGES="$cargo_messages" \
          RESOLVED_EXECUTABLES="$resolved_executables" \
          node --input-type=module <<'CARGO_NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const executableTargets = new Map([
            ["codegraph-host-path-bridge", new Set()],
            ["codegraph-host-path-daemon", new Set()],
          ]);
          const lines = readFileSync(process.env.CARGO_MESSAGES, "utf8").split(/\r?\n/u);
          for (const [index, line] of lines.entries()) {
            if (line.length === 0) continue;
            let message;
            try {
              message = JSON.parse(line);
            } catch (error) {
              throw new Error(`Cargo JSON 第 ${index + 1} 行无效。`, { cause: error });
            }
            if (message.reason !== "compiler-artifact") continue;
            const targetName = message.target?.name;
            if (
              !executableTargets.has(targetName) ||
              !Array.isArray(message.target?.kind) ||
              !message.target.kind.includes("bin") ||
              message.executable === null
            ) {
              continue;
            }
            if (
              typeof message.executable !== "string" ||
              message.executable.length === 0 ||
              /[\0\r\n]/u.test(message.executable)
            ) {
              throw new Error(`Cargo 未为 ${targetName} 返回安全 executable path。`);
            }
            executableTargets.get(targetName).add(message.executable);
          }
          const resolved = {};
          for (const [targetName, executablePaths] of executableTargets) {
            if (executablePaths.size !== 1) {
              throw new Error(
                `Cargo 必须为 ${targetName} 唯一归因一个 executable path，实际为 ${executablePaths.size}。`,
              );
            }
            resolved[targetName] = [...executablePaths][0];
          }
          writeFileSync(process.env.RESOLVED_EXECUTABLES, `${JSON.stringify(resolved)}\n`, {
            mode: 0o600,
          });
          CARGO_NODE
          bridge_source="$(RESOLVED_EXECUTABLES="$resolved_executables" node --input-type=module --eval 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.env.RESOLVED_EXECUTABLES, "utf8"))["codegraph-host-path-bridge"])')"
          daemon_source="$(RESOLVED_EXECUTABLES="$resolved_executables" node --input-type=module --eval 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync(process.env.RESOLVED_EXECUTABLES, "utf8"))["codegraph-host-path-daemon"])')"
          expected_bridge_source="$helper_build_home/.cargo-target/release/codegraph-host-path-bridge"
          expected_daemon_source="$helper_build_home/.cargo-target/release/codegraph-host-path-daemon"
          printf 'cargo-topology[bridge]: resolved=%s expected=%s\n' \
            "$bridge_source" "$expected_bridge_source"
          printf 'cargo-topology[daemon]: resolved=%s expected=%s\n' \
            "$daemon_source" "$expected_daemon_source"
          if [[ "$bridge_source" != "$expected_bridge_source" ]]; then
            echo "cargo-topology[bridge]: fail" >&2
            exit 1
          fi
          if [[ "$daemon_source" != "$expected_daemon_source" ]]; then
            echo "cargo-topology[daemon]: fail" >&2
            exit 1
          fi

          validate_trusted_system_tool_policy() {
            local label="$1"
            local alias_path="$2"
            local alias_type="$3"
            local alias_uid="$4"
            local alias_gid="$5"
            local alias_mode="$6"
            local resolved_path="$7"
            local target_type="$8"
            local target_uid="${9}"
            local target_gid="${10}"
            local target_mode="${11}"
            local target_executable="${12}"
            local alias_stable="${13}"
            local target_stable="${14}"
            local target_mode_bits

            printf 'trusted-tool[%s] proof: alias=%s resolved=%s alias-type=%s alias-owner=%s:%s alias-mode=%s target-type=%s target-owner=%s:%s target-mode=%s target-executable=%s alias-stable=%s target-stable=%s\n' \
              "$label" "$alias_path" "$resolved_path" "$alias_type" "$alias_uid" "$alias_gid" \
              "$alias_mode" "$target_type" "$target_uid" "$target_gid" "$target_mode" \
              "$target_executable" "$alias_stable" "$target_stable"

            case "$alias_path" in
              /usr/bin/file|/usr/bin/readelf) ;;
              *)
                echo "trusted-tool[$label] alias-policy: fail" >&2
                return 1
                ;;
            esac
            case "$alias_type" in
              "regular file"|"symbolic link") ;;
              *)
                echo "trusted-tool[$label] alias-type: fail" >&2
                return 1
                ;;
            esac
            if [[ "$alias_uid" != "0" ]]; then
              echo "trusted-tool[$label] alias-owner: fail" >&2
              return 1
            fi
            if [[ -z "$resolved_path" ]]; then
              echo "trusted-tool[$label] resolved-target: fail" >&2
              return 1
            fi
            case "$resolved_path" in
              /usr/bin/?*|/bin/?*) ;;
              *)
                echo "trusted-tool[$label] resolved-policy: fail" >&2
                return 1
                ;;
            esac
            if [[ "$target_type" != "regular file" ]]; then
              echo "trusted-tool[$label] target-regular: fail" >&2
              return 1
            fi
            if [[ "$target_uid" != "0" ]]; then
              echo "trusted-tool[$label] target-owner: fail" >&2
              return 1
            fi
            if [[ ! "$target_mode" =~ ^[0-7]{3,4}$ ]]; then
              echo "trusted-tool[$label] target-mode-format: fail" >&2
              return 1
            fi
            target_mode_bits=$((8#$target_mode))
            if (( (target_mode_bits & 0022) != 0 )); then
              echo "trusted-tool[$label] target-mode: fail" >&2
              return 1
            fi
            if [[ "$target_executable" != "yes" ]]; then
              echo "trusted-tool[$label] target-executable: fail" >&2
              return 1
            fi
            if [[ "$alias_stable" != "yes" ]]; then
              echo "trusted-tool[$label] alias-stable: fail" >&2
              return 1
            fi
            if [[ "$target_stable" != "yes" ]]; then
              echo "trusted-tool[$label] target-stable: fail" >&2
              return 1
            fi
          }

          resolve_trusted_system_tool() {
            local label="$1"
            local alias_path="$2"
            local alias_stat_before="unavailable|unavailable|unavailable|unavailable|unavailable"
            local alias_stat_after="unavailable|unavailable|unavailable|unavailable|unavailable"
            local alias_type="unavailable"
            local alias_uid="unavailable"
            local alias_gid="unavailable"
            local alias_mode="unavailable"
            local alias_identity_before="unavailable"
            local resolved_path=""
            local resolved_after=""
            local target_stat_before="unavailable|unavailable|unavailable|unavailable|unavailable"
            local target_stat_after="unavailable|unavailable|unavailable|unavailable|unavailable"
            local target_type="unavailable"
            local target_uid="unavailable"
            local target_gid="unavailable"
            local target_mode="unavailable"
            local target_identity_before="unavailable"
            local target_executable="no"
            local alias_stable="no"
            local target_stable="no"

            alias_stat_before="$(stat -c '%F|%u|%g|%a|dev=%d inode=%i size=%s mtime=%Y ctime=%Z' -- "$alias_path" 2>/dev/null || printf 'unavailable|unavailable|unavailable|unavailable|unavailable')"
            IFS='|' read -r alias_type alias_uid alias_gid alias_mode alias_identity_before <<< "$alias_stat_before"
            resolved_path="$(readlink -e -- "$alias_path" 2>/dev/null || true)"
            if [[ -n "$resolved_path" ]]; then
              target_stat_before="$(stat -Lc '%F|%u|%g|%a|dev=%d inode=%i size=%s mtime=%Y ctime=%Z' -- "$resolved_path" 2>/dev/null || printf 'unavailable|unavailable|unavailable|unavailable|unavailable')"
              IFS='|' read -r target_type target_uid target_gid target_mode target_identity_before <<< "$target_stat_before"
              if [[ -x "$resolved_path" ]]; then
                target_executable="yes"
              fi
            fi

            # alias 可以是 distro symlink；安全边界落在固定 alias、canonical target 与两者稳定身份上。
            alias_stat_after="$(stat -c '%F|%u|%g|%a|dev=%d inode=%i size=%s mtime=%Y ctime=%Z' -- "$alias_path" 2>/dev/null || printf 'unavailable|unavailable|unavailable|unavailable|unavailable')"
            resolved_after="$(readlink -e -- "$alias_path" 2>/dev/null || true)"
            if [[ -n "$resolved_after" ]]; then
              target_stat_after="$(stat -Lc '%F|%u|%g|%a|dev=%d inode=%i size=%s mtime=%Y ctime=%Z' -- "$resolved_after" 2>/dev/null || printf 'unavailable|unavailable|unavailable|unavailable|unavailable')"
            fi
            if [[ "$alias_stat_before" == "$alias_stat_after" && "$resolved_path" == "$resolved_after" ]]; then
              alias_stable="yes"
            fi
            if [[ -n "$resolved_path" && "$resolved_path" == "$resolved_after" && "$target_stat_before" == "$target_stat_after" ]]; then
              target_stable="yes"
            fi

            validate_trusted_system_tool_policy \
              "$label" "$alias_path" "$alias_type" "$alias_uid" "$alias_gid" "$alias_mode" \
              "$resolved_path" "$target_type" "$target_uid" "$target_gid" "$target_mode" \
              "$target_executable" "$alias_stable" "$target_stable"
            trusted_tool_resolved="$resolved_path"
            trusted_tool_identity="$target_stat_after"
          }

          assert_trusted_system_tool_identity() {
            local label="$1"
            local resolved_path="$2"
            local expected_identity="$3"
            local current_identity

            current_identity="$(stat -Lc '%F|%u|%g|%a|dev=%d inode=%i size=%s mtime=%Y ctime=%Z' -- "$resolved_path" 2>/dev/null || printf 'unavailable')"
            printf 'trusted-tool[%s] use-topology: resolved=%s expected-identity=%s current-identity=%s\n' \
              "$label" "$resolved_path" "$expected_identity" "$current_identity"
            if [[ "$current_identity" != "$expected_identity" ]]; then
              echo "trusted-tool[$label] use-identity: fail" >&2
              return 1
            fi
          }

          resolve_trusted_system_tool file /usr/bin/file
          file_tool="$trusted_tool_resolved"
          file_tool_identity="$trusted_tool_identity"
          resolve_trusted_system_tool readelf /usr/bin/readelf
          readelf_tool="$trusted_tool_resolved"
          readelf_tool_identity="$trusted_tool_identity"
          prove_private_binary() {
            local label="$1"
            local source="$2"
            local source_parent
            local lstat_output
            local source_uid
            local source_gid
            local source_owner
            local source_group
            local source_mode
            local source_size
            local source_sha
            local file_description
            local elf_header
            local elf_class
            local elf_machine
            local elf_type

            source_parent="$(dirname -- "$source")"
            printf 'helper-proof[%s] parent-traversal: identity=gatecandidate path=%s\n' "$label" "$source_parent"
            if ! sudo -u gatecandidate test -x "$source_parent"; then
              echo "helper-proof[$label] parent-traversal: fail" >&2
              return 1
            fi
            echo "helper-proof[$label] parent-traversal: pass"

            lstat_output="$(sudo stat --printf='type=%F uid=%u gid=%g mode=%a size=%s inode=%i' -- "$source")"
            printf 'helper-proof[%s] lstat: %s\n' "$label" "$lstat_output"
            if ! sudo test -f "$source"; then
              echo "helper-proof[$label] regular: fail" >&2
              return 1
            fi
            echo "helper-proof[$label] regular: pass"
            if sudo test -L "$source"; then
              echo "helper-proof[$label] non-symlink: fail" >&2
              return 1
            fi
            echo "helper-proof[$label] non-symlink: pass"

            source_uid="$(sudo stat -c '%u' -- "$source")"
            source_gid="$(sudo stat -c '%g' -- "$source")"
            source_owner="$(sudo stat -c '%U' -- "$source")"
            source_group="$(sudo stat -c '%G' -- "$source")"
            printf 'helper-proof[%s] owner-group: uid=%s gid=%s owner=%s group=%s\n' \
              "$label" "$source_uid" "$source_gid" "$source_owner" "$source_group"
            [[ "$source_uid:$source_gid" == "20001:20001" ]]

            source_mode="$(sudo stat -c '%a' -- "$source")"
            printf 'helper-proof[%s] numeric-mode: %s\n' "$label" "$source_mode"
            [[ "$source_mode" =~ ^[0-7]{3,4}$ ]]
            if (( (8#$source_mode & 0022) != 0 )); then
              echo "helper-proof[$label] numeric-mode: group/world writable" >&2
              return 1
            fi

            source_size="$(sudo stat -c '%s' -- "$source")"
            printf 'helper-proof[%s] size: %s\n' "$label" "$source_size"
            [[ "$source_size" =~ ^[1-9][0-9]*$ ]]
            source_sha="$(sudo sha256sum -- "$source" | cut -d ' ' -f 1)"
            printf 'helper-proof[%s] sha256: %s\n' "$label" "$source_sha"
            [[ "$source_sha" =~ ^[a-f0-9]{64}$ ]]

            assert_trusted_system_tool_identity file "$file_tool" "$file_tool_identity"
            file_description="$(sudo env LC_ALL=C "$file_tool" --brief -- "$source")"
            printf 'helper-proof[%s] file: %s\n' "$label" "$file_description"
            [[ "$file_description" == ELF\ 64-bit\ LSB* ]]
            [[ "$file_description" == *x86-64* ]]
            [[ "$file_description" == *executable* ]]

            assert_trusted_system_tool_identity readelf "$readelf_tool" "$readelf_tool_identity"
            elf_header="$(sudo env LC_ALL=C "$readelf_tool" -h -- "$source")"
            elf_class="$(awk -F: '/^[[:space:]]*Class:/{sub(/^[[:space:]]*/, "", $2); print $2; exit}' <<< "$elf_header")"
            elf_machine="$(awk -F: '/^[[:space:]]*Machine:/{sub(/^[[:space:]]*/, "", $2); print $2; exit}' <<< "$elf_header")"
            elf_type="$(awk -F: '/^[[:space:]]*Type:/{sub(/^[[:space:]]*/, "", $2); print $2; exit}' <<< "$elf_header")"
            printf 'helper-proof[%s] elf-class: %s\n' "$label" "$elf_class"
            printf 'helper-proof[%s] elf-machine: %s\n' "$label" "$elf_machine"
            printf 'helper-proof[%s] elf-type: %s\n' "$label" "$elf_type"
            [[ "$elf_class" == "ELF64" ]]
            [[ "$elf_machine" == "Advanced Micro Devices X86-64" ]]
            case "$elf_type" in
              EXEC*|DYN*) ;;
              *)
                echo "helper-proof[$label] elf-type: 非可执行 ELF 类型" >&2
                return 1
                ;;
            esac

            if ! sudo -u gatecandidate test -x "$source"; then
              echo "helper-proof[$label] gatecandidate-x-ok: fail" >&2
              return 1
            fi
            echo "helper-proof[$label] gatecandidate-x-ok: pass"
          }
          prove_private_binary bridge "$bridge_source"
          prove_private_binary daemon "$daemon_source"

          run_zero_argument_probe() {
            local label="$1"
            local source="$2"
            local expected_stderr="$3"
            local probe_stdout="$material_staging/$label.exec.stdout"
            local probe_stderr="$material_staging/$label.exec.stderr"
            local probe_status

            set +e
            sudo -u gatecandidate env -i \
              HOME="$helper_build_home" \
              LANG=C.UTF-8 \
              PATH=/usr/bin:/bin \
              TMPDIR="$helper_build_home" \
              "$source" > "$probe_stdout" 2> "$probe_stderr"
            probe_status=$?
            set -e
            printf 'helper-proof[%s] exec-probe: status=%s stdout-bytes=%s stderr-bytes=%s\n' \
              "$label" "$probe_status" "$(stat -c '%s' "$probe_stdout")" "$(stat -c '%s' "$probe_stderr")"
            case "$probe_status" in
              126|127)
                echo "helper-proof[$label] exec-probe: shell launch failure" >&2
                return 1
                ;;
            esac
            if grep -Eiq 'permission denied|exec format' "$probe_stderr"; then
              echo "helper-proof[$label] exec-probe: loader failure" >&2
              return 1
            fi
            if (( probe_status != 1 )); then
              echo "helper-proof[$label] exec-probe: unexpected exit=$probe_status" >&2
              return 1
            fi
            [[ ! -s "$probe_stdout" ]] || {
              echo "helper-proof[$label] exec-probe: unexpected stdout" >&2
              return 1
            }
            if ! cmp --silent -- "$probe_stderr" <(printf '%s\n' "$expected_stderr"); then
              echo "helper-proof[$label] exec-probe: stderr mismatch" >&2
              sed -n 'l' "$probe_stderr" >&2
              return 1
            fi
            echo "helper-proof[$label] exec-probe: pass"
          }
          run_zero_argument_probe bridge "$bridge_source" BRIDGE_ARGV
          run_zero_argument_probe daemon "$daemon_source" DAEMON_ARGV

          # 冻结前终止候选 UID 的全部残留进程，消除候选并发改写已验证输出的窗口。
          sudo pkill -KILL -u 20001 || true
          for _ in $(seq 1 50); do
            if ! sudo pgrep -u 20001 >/dev/null; then
              break
            fi
            sleep 0.1
          done
          if sudo pgrep -u 20001 >/dev/null; then
            echo "候选 UID 20001 在冻结前仍有残留进程。" >&2
            exit 1
          fi

          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "$(stat -c '%u:%g %a' "$material_staging")" == "$runner_uid:$runner_gid 700" ]]
          bridge_staged="$material_staging/codegraph-host-path-bridge"
          daemon_staged="$material_staging/codegraph-host-path-daemon"
          freeze_private_binary() {
            local label="$1"
            local source="$2"
            local staged="$3"
            local source_sha
            local staged_sha

            if ! sudo test -f "$source"; then
              echo "helper-freeze[$label] source regular: fail" >&2
              return 1
            fi
            if sudo test -L "$source"; then
              echo "helper-freeze[$label] source non-symlink: fail" >&2
              return 1
            fi
            [[ ! -e "$staged" ]]
            source_sha="$(sudo sha256sum -- "$source" | cut -d ' ' -f 1)"
            sudo install -o "$runner_uid" -g "$runner_gid" -m 0700 "$source" "$staged"
            [[ -f "$staged" ]]
            [[ ! -L "$staged" ]]
            [[ "$(stat -c '%u:%g %a' "$staged")" == "$runner_uid:$runner_gid 700" ]]
            staged_sha="$(sha256sum -- "$staged" | cut -d ' ' -f 1)"
            printf 'helper-freeze[%s] source-sha256=%s staged-sha256=%s\n' \
              "$label" "$source_sha" "$staged_sha"
            [[ "$source_sha" == "$staged_sha" ]]
          }
          freeze_private_binary bridge "$bridge_source" "$bridge_staged"
          freeze_private_binary daemon "$daemon_source" "$daemon_staged"
          bridge_staged_sha="$(sha256sum -- "$bridge_staged" | cut -d ' ' -f 1)"
          daemon_staged_sha="$(sha256sum -- "$daemon_staged" | cut -d ' ' -f 1)"

          BRIDGE_SOURCE="$bridge_staged" \
          DAEMON_SOURCE="$daemon_staged" \
          HEAD_OID="$HEAD_OID" \
          MATERIAL_STAGING="$material_staging" \
          node --input-type=module <<'NODE'
          import {
            createHash,
            generateKeyPairSync,
            randomBytes,
            sign,
          } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";

          const canonicalJson = (value) => {
            if (value === null || typeof value === "boolean" || typeof value === "string") {
              return JSON.stringify(value);
            }
            if (typeof value === "number" && Number.isSafeInteger(value) && !Object.is(value, -0)) {
              return String(value);
            }
            if (Array.isArray(value)) {
              return `[${value.map(canonicalJson).join(",")}]`;
            }
            if (typeof value === "object") {
              return `{${Object.keys(value).sort().map((key) =>
                `${JSON.stringify(key)}:${canonicalJson(value[key])}`
              ).join(",")}}`;
            }
            throw new Error("provenance 只允许 canonical JSON 子集。");
          };
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const bridgeBinarySha256 = sha256(readFileSync(process.env.BRIDGE_SOURCE));
          const daemonBinarySha256 = sha256(readFileSync(process.env.DAEMON_SOURCE));
          const jobIdentity = `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}-${process.env.HEAD_OID.slice(0, 12)}`;
          // 固定文件名来自运行时 ABI；签名根仅属于当前 job，私钥不落盘且不得作为 release 材料发布。
          const { privateKey, publicKey } = generateKeyPairSync("ed25519");
          const publicDer = publicKey.export({ format: "der", type: "spki" });
          const publicPrefix = Buffer.from("302a300506032b6570032100", "hex");
          if (!publicDer.subarray(0, publicPrefix.length).equals(publicPrefix) || publicDer.length !== 44) {
            throw new Error("Ed25519 公钥编码不符合固定 SPKI 形状。");
          }
          const payload = {
            bridgeBinarySha256,
            daemonBinarySha256,
            schemaVersion: 2,
            signatureKeyId: `ci-job-scoped-key-${jobIdentity}`,
            signerId: `ci-job-scoped-signer-${jobIdentity}`,
          };
          const payloadBytes = Buffer.from(canonicalJson(payload), "utf8");
          const provenance = {
            ...payload,
            manifestSha256: sha256(payloadBytes),
            signature: sign(null, payloadBytes, privateKey).toString("hex"),
          };
          writeFileSync(
            `${process.env.MATERIAL_STAGING}/client.key`,
            `${randomBytes(32).toString("hex")}\n`,
            { mode: 0o600 },
          );
          writeFileSync(
            `${process.env.MATERIAL_STAGING}/provenance.json`,
            `${canonicalJson(provenance)}\n`,
            { mode: 0o600 },
          );
          writeFileSync(
            `${process.env.MATERIAL_STAGING}/release.pub`,
            `${publicDer.subarray(publicPrefix.length).toString("hex")}\n`,
            { mode: 0o600 },
          );
          NODE
          sudo install -d -o 0 -g 0 -m 0755 /usr/libexec /usr/share/codegraph-host-path
          sudo install -d -o 0 -g 20001 -m 0750 /etc/codegraph-host-path
          sudo install -o 0 -g 0 -m 0755 "$bridge_staged" /usr/libexec/codegraph-host-path-bridge
          sudo install -o 0 -g 0 -m 0755 "$daemon_staged" /usr/libexec/codegraph-host-path-daemon
          sudo install -o 0 -g 20001 -m 0640 "$material_staging/client.key" /etc/codegraph-host-path/client.key
          sudo install -o 0 -g 0 -m 0644 "$material_staging/provenance.json" /usr/share/codegraph-host-path/provenance.json
          sudo install -o 0 -g 0 -m 0644 "$material_staging/release.pub" /usr/share/codegraph-host-path/release.pub
          [[ -f /usr/libexec/codegraph-host-path-bridge && ! -L /usr/libexec/codegraph-host-path-bridge ]]
          [[ -f /usr/libexec/codegraph-host-path-daemon && ! -L /usr/libexec/codegraph-host-path-daemon ]]
          bridge_sha="$(sha256sum /usr/libexec/codegraph-host-path-bridge | cut -d ' ' -f 1)"
          daemon_sha="$(sha256sum /usr/libexec/codegraph-host-path-daemon | cut -d ' ' -f 1)"
          expected_bridge_sha="$(node --input-type=module --eval 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("/usr/share/codegraph-host-path/provenance.json", "utf8")).bridgeBinarySha256)')"
          expected_daemon_sha="$(node --input-type=module --eval 'import { readFileSync } from "node:fs"; process.stdout.write(JSON.parse(readFileSync("/usr/share/codegraph-host-path/provenance.json", "utf8")).daemonBinarySha256)')"
          [[ "$bridge_sha" == "$bridge_staged_sha" ]]
          [[ "$daemon_sha" == "$daemon_staged_sha" ]]
          [[ "$expected_bridge_sha" == "$bridge_staged_sha" ]]
          [[ "$expected_daemon_sha" == "$daemon_staged_sha" ]]
          [[ "$bridge_sha" == "$expected_bridge_sha" ]]
          [[ "$daemon_sha" == "$expected_daemon_sha" ]]
          [[ "$(stat -c '%U:%G %a' /usr/libexec/codegraph-host-path-bridge)" == "root:root 755" ]]
          [[ "$(stat -c '%U:%G %a' /usr/libexec/codegraph-host-path-daemon)" == "root:root 755" ]]
          [[ "$(stat -c '%U:%G %a' /etc/codegraph-host-path)" == "root:gatecandidate 750" ]]
          [[ "$(stat -c '%U:%G %a' /etc/codegraph-host-path/client.key)" == "root:gatecandidate 640" ]]
          [[ "$(stat -c '%U:%G %a' /usr/share/codegraph-host-path/provenance.json)" == "root:root 644" ]]
          [[ "$(stat -c '%U:%G %a' /usr/share/codegraph-host-path/release.pub)" == "root:root 644" ]]
          daemon_pid="$(sudo /bin/sh -c 'umask 0007; nohup /usr/libexec/codegraph-host-path-daemon serve-v1 --socket /run/codegraph-host-path/helper.sock --key /etc/codegraph-host-path/client.key --provenance /usr/share/codegraph-host-path/provenance.json --public-key /usr/share/codegraph-host-path/release.pub >/run/codegraph-host-path/daemon.log 2>&1 & echo $!')"
          [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]
          printf '%s\n' "$daemon_pid" | sudo tee /run/codegraph-host-path/daemon.pid >/dev/null
          sudo chown 0:0 /run/codegraph-host-path/daemon.pid
          sudo chmod 0644 /run/codegraph-host-path/daemon.pid
          for _ in $(seq 1 100); do
            if [[ -S /run/codegraph-host-path/helper.sock ]] && sudo kill -0 "$daemon_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          [[ -S /run/codegraph-host-path/helper.sock ]]
          sudo kill -0 "$daemon_pid"
          [[ "$(sudo readlink -f "/proc/$daemon_pid/exe")" == "/usr/libexec/codegraph-host-path-daemon" ]]
          sudo chown 0:20001 /run/codegraph-host-path/helper.sock
          sudo chmod 0660 /run/codegraph-host-path/helper.sock
          [[ "$(stat -c '%U:%G %a' /run/codegraph-host-path/helper.sock)" == "root:gatecandidate 660" ]]
          printf 'HOST_PATH_DAEMON_PID=%s\n' "$daemon_pid" >> "$GITHUB_ENV"
          sudo git -c safe.directory="$candidate_root" -C "$candidate_root" diff --quiet --no-ext-diff HEAD --
          cleanup_helper_staging
          trap - EXIT

      - name: Verify real Linux host-path helper preflight
        shell: bash
        run: |
          set -euo pipefail
          candidate_root=/tmp/gatecandidate-root/worktree
          preflight_root=/g/platform-fix156-preflight
          preflight_home="$preflight_root/home"
          preflight_tmp="$preflight_root/tmp"
          cleanup_preflight() {
            sudo /usr/bin/btrfs subvolume delete -- "$preflight_root" >/dev/null 2>&1 || true
          }
          trap cleanup_preflight EXIT
          sudo /usr/bin/btrfs subvolume create "$preflight_root"
          sudo chown 20001:20001 "$preflight_root"
          sudo chmod 0700 "$preflight_root"
          sudo -u gatecandidate /usr/bin/mkdir -m 0700 "$preflight_home" "$preflight_tmp"
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            CI=true \
            HOME="$preflight_home" \
            LANG=C.UTF-8 \
            PATH=/opt/trusted-pnpm/bin:/usr/bin:/bin \
            TMPDIR="$preflight_tmp" \
            XDG_CACHE_HOME="$preflight_home/.cache" \
            XDG_CONFIG_HOME="$preflight_home/.config" \
            XDG_DATA_HOME="$preflight_home/.local/share" \
            npm_config_enable_pre_post_scripts=false \
            npm_config_ignore_pnpmfile=true \
            npm_config_verify_deps_before_run=false \
            pnpm --dir "$candidate_root" exec tsc \
              -p packages/adapters/host-path-posix-native/tsconfig.build.json --pretty false
          sudo -u gatecandidate /usr/bin/touch "$preflight_root/input.txt"
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            HOME="$preflight_home" \
            LANG=C.UTF-8 \
            PATH=/usr/bin:/bin \
            PREFLIGHT_ROOT="$preflight_root" \
            node --input-type=module <<'NODE'
          import { captureHostPathPosixNativeV1 } from "./packages/adapters/host-path-posix-native/dist/index.js";
          import { createInstalledLinuxSnapshotHelperBindingV1 } from "./packages/adapters/host-path-posix-native/dist/linux-helper.js";

          const binding = await createInstalledLinuxSnapshotHelperBindingV1();
          const inputPath = `${process.env.PREFLIGHT_ROOT}/input.txt`;
          const outcome = await captureHostPathPosixNativeV1({
            binding,
            candidates: [{
              absolutePath: inputPath,
              candidateIndex: 0,
              logicalPath: "input.txt",
              trustedPath: inputPath,
            }],
            captureNonce: "platform-fix156-positive",
            indexingRoot: process.env.PREFLIGHT_ROOT,
            platform: "linux",
          });
          if (outcome.status !== "complete" || outcome.items.length !== 1) {
            throw new Error(`真实 helper positive preflight 失败：${JSON.stringify(outcome)}`);
          }
          NODE
          release_backup=/run/codegraph-host-path/release.pub.preflight-backup
          release_digest="$(sha256sum /usr/share/codegraph-host-path/release.pub | cut -d ' ' -f 1)"
          sudo cp --preserve=mode,ownership -- /usr/share/codegraph-host-path/release.pub "$release_backup"
          invalid_public_key="$(node --input-type=module --eval 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("hex"))')"
          printf '%s\n' "$invalid_public_key" | sudo tee /usr/share/codegraph-host-path/release.pub >/dev/null
          sudo chown 0:0 /usr/share/codegraph-host-path/release.pub
          sudo chmod 0644 /usr/share/codegraph-host-path/release.pub
          sudo -u gatecandidate env -i --chdir="$candidate_root" \
            HOME="$preflight_home" \
            LANG=C.UTF-8 \
            PATH=/usr/bin:/bin \
            node --input-type=module <<'NODE'
          import { createInstalledLinuxSnapshotHelperBindingV1 } from "./packages/adapters/host-path-posix-native/dist/linux-helper.js";

          try {
            await createInstalledLinuxSnapshotHelperBindingV1();
            throw new Error("篡改签名根后 helper 未 fail closed。");
          } catch (error) {
            if (error?.code !== "LINUX_HELPER_INITIALIZATION_FAILED") {
              throw error;
            }
            process.stdout.write("real helper fail-closed preflight passed\n");
          }
          NODE
          sudo mv -- "$release_backup" /usr/share/codegraph-host-path/release.pub
          [[ "$(sha256sum /usr/share/codegraph-host-path/release.pub | cut -d ' ' -f 1)" == "$release_digest" ]]
          [[ "$(stat -c '%U:%G %a' /etc/codegraph-host-path/client.key)" == "root:gatecandidate 640" ]]
          [[ "$(stat -c '%U:%G %a' /run/codegraph-host-path/helper.sock)" == "root:gatecandidate 660" ]]
          sudo kill -0 "$HOST_PATH_DAEMON_PID"
          sudo git -c safe.directory="$candidate_root" -C "$candidate_root" diff --quiet --no-ext-diff HEAD --
          cleanup_preflight
          trap - EXIT

      - name: Produce child gate evidence
        env:
          BASE_OID: ${{ inputs.base_oid }}
          HEAD_OID: ${{ inputs.head_oid }}
          OBJECT_FORMAT: ${{ inputs.object_format }}
          PULL_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
          PRODUCER_WORKFLOW_SHA: ${{ inputs.producer_workflow_sha }}
          PROVIDER_REPOSITORY_ID: ${{ inputs.provider_repository_id }}
          TRUSTED_PNPM_BIN: /opt/trusted-pnpm/bin
          TRUSTED_RUST_BIN: /opt/trusted-rust/bin
        shell: bash
        run: |
          sudo env -i HOME="$PWD/trusted-harness-home" LANG=C.UTF-8 PATH="$TRUSTED_RUST_BIN:$TRUSTED_PNPM_BIN:$PATH" node trusted-harness/bin/produce-gate-evidence.mjs \
            --artifact-directory artifacts \
            --base-oid "$BASE_OID" \
            --candidate-root /tmp/gatecandidate-root/worktree \
            --controller-repository Rockyyy-S/code-graph-gate-controller \
            --execution-partition portable \
            --gate-gid 20001 \
            --gate-home /tmp/gatecandidate-home \
            --gate-temp-directory /g \
            --gate-uid 20001 \
            --harness-contract-version 4 \
            --head-oid "$HEAD_OID" \
            --object-format "$OBJECT_FORMAT" \
            --provider-repository-id "$PROVIDER_REPOSITORY_ID" \
            --proposed-record-directory "$PWD/trusted-state/trusted/proposed" \
            --pull-number "$PULL_NUMBER" \
            --trusted-record trusted-state/trusted/registry.json \
            --workflow-file produce-gate-evidence.yml \
            --workflow-sha "$PRODUCER_WORKFLOW_SHA"

      - name: Upload unsigned evidence from isolated execution job
        if: ${{ always() && hashFiles('artifacts/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 固定 v4 提交
        with:
          if-no-files-found: error
          name: gate-evidence-portable-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.head_oid }}
          path: artifacts/
          retention-days: 1

      - name: Tear down portable helper and snapshot runtime
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          cleanup_status=0
          daemon_pid="${HOST_PATH_DAEMON_PID:-}"
          if [[ ! "$daemon_pid" =~ ^[1-9][0-9]*$ ]] && [[ -f /run/codegraph-host-path/daemon.pid ]]; then
            daemon_pid="$(sudo tr -d '[:space:]' </run/codegraph-host-path/daemon.pid)"
          fi
          if [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]; then
            sudo kill -TERM "$daemon_pid" 2>/dev/null || true
            for _ in $(seq 1 50); do
              if ! sudo kill -0 "$daemon_pid" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done
            if sudo kill -0 "$daemon_pid" 2>/dev/null; then
              sudo kill -KILL "$daemon_pid" 2>/dev/null || cleanup_status=1
            fi
          fi
          sudo pkill -KILL -f '^/usr/libexec/codegraph-host-path-bridge( |$)' 2>/dev/null || true
          sudo pkill -KILL -u 20001 || true
          if mountpoint --quiet /g; then
            sudo /usr/bin/umount -- /g || cleanup_status=1
          fi
          if [[ "${GATE_BTRFS_LOOP:-}" =~ ^/dev/loop[0-9]+$ ]]; then
            sudo "${GATE_BTRFS_LOSETUP:-/usr/sbin/losetup}" --detach "$GATE_BTRFS_LOOP" || cleanup_status=1
          fi
          sudo rm -f -- \
            /etc/codegraph-host-path/client.key \
            /usr/share/codegraph-host-path/provenance.json \
            /usr/share/codegraph-host-path/release.pub \
            /usr/libexec/codegraph-host-path-bridge \
            /usr/libexec/codegraph-host-path-daemon
          sudo rm -rf -- /etc/codegraph-host-path /usr/share/codegraph-host-path /run/codegraph-host-path
          rm -f -- "${GATE_BTRFS_IMAGE:-}"
          sudo rmdir -- /g 2>/dev/null || true
          sudo rm -rf -- /tmp/gatecandidate-root /tmp/gatecandidate-home \
            /tmp/gatecandidate-helper-build /tmp/gatecandidate-install-home /tmp/gatecandidate-install-tmp
          exit "$cleanup_status"

  gate-execution-win32:
    name: gate-execution-win32
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Validate fixed provider inputs
        env:
          BASE_OID: ${{ inputs.base_oid }}
          HEAD_OID: ${{ inputs.head_oid }}
          OBJECT_FORMAT: ${{ inputs.object_format }}
          PULL_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
          PRODUCER_WORKFLOW_SHA: ${{ inputs.producer_workflow_sha }}
          PROVIDER_REPOSITORY_ID: ${{ inputs.provider_repository_id }}
          REPOSITORY: ${{ inputs.repository }}
        shell: pwsh
        run: |
          if ($env:BASE_OID -notmatch '^[a-f0-9]{40}$') { throw 'base_oid 无效。' }
          if ($env:HEAD_OID -notmatch '^[a-f0-9]{40}$') { throw 'head_oid 无效。' }
          if ($env:OBJECT_FORMAT -ne 'sha1') { throw 'object_format 无效。' }
          if ($env:PULL_NUMBER -notmatch '^(0|[1-9][0-9]*)$') { throw 'pull number 无效。' }
          if ($env:PRODUCER_WORKFLOW_SHA -notmatch '^[a-f0-9]{40}$') { throw 'producer SHA 无效。' }
          if ($env:PROVIDER_REPOSITORY_ID -ne '1303415307') { throw 'provider repository id 无效。' }
          if ($env:REPOSITORY -ne 'Rockyyy-S/code-graph') { throw 'provider repository 无效。' }

      - name: Enforce byte-exact LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          if ((git config --global --get core.autocrlf) -ne 'false') { throw 'core.autocrlf 未锁定为 false。' }
          if ((git config --global --get core.eol) -ne 'lf') { throw 'core.eol 未锁定为 lf。' }

      - name: Checkout immutable GateHarness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定 v4 提交
        with:
          fetch-depth: 1
          path: trusted-harness
          persist-credentials: false
          ref: f03e200280d8da8bdd474abe01b9ef2e90f3a631
          repository: Rockyyy-S/code-graph-gate-controller

      - name: Checkout trusted registry state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定 v4 提交
        with:
          fetch-depth: 1
          path: trusted-state
          persist-credentials: false
          ref: main
          repository: Rockyyy-S/code-graph-gate-controller

      - name: Checkout exact candidate OID
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定 v4 提交
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ inputs.head_oid }}
          repository: ${{ inputs.repository }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # 固定 v4 提交
        with:
          node-version: 24.18.0

      - name: Select dedicated fixed NTFS root with bounded preflight
        shell: pwsh
        run: |
          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts-win32'
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          $artifactPath = Join-Path $artifactDirectory 'win32-preflight.json'
          $startedAt = Get-Date
          $report = [ordered]@{
            schemaVersion = 1
            processPlatform = if ($IsWindows) { 'win32' } else { [Environment]::OSVersion.Platform.ToString() }
            candidateRoot = (Resolve-Path -LiteralPath 'candidate').Path
            runnerTemp = $env:RUNNER_TEMP
            selectedRoot = $null
            drive = $null
            fileSystem = $null
            driveType = $null
            getVolume = [ordered]@{ status = $null; stdout = ''; stderr = ''; timeout = $false }
            root = [ordered]@{ ordinary = $false; reparse = $null }
            probeStartedAt = $startedAt.ToUniversalTime().ToString('o')
            probeDurationMs = 0
          }
          $failure = $null
          $job = $null
          try {
            if (-not $IsWindows) { throw 'NON_WIN32: hosted preflight 必须运行在 Windows。' }
            $job = Start-Job -ScriptBlock {
              $ErrorActionPreference = 'Stop'
              @(Get-Volume -ErrorAction Stop | ForEach-Object {
                [ordered]@{
                  DriveLetter = [string]$_.DriveLetter
                  FileSystem = [string]$_.FileSystem
                  DriveType = [string]$_.DriveType
                }
              }) | ConvertTo-Json -Compress
            }
            $completed = Wait-Job -Job $job -Timeout 10
            if ($null -eq $completed) {
              $report.getVolume.timeout = $true
              $report.getVolume.stderr = 'Get-Volume exceeded 10 second deadline.'
              throw 'GET_VOLUME_TIMEOUT: Get-Volume 超过固定 deadline。'
            }
            $probeErrors = @()
            $probeOutput = Receive-Job -Job $job -ErrorAction SilentlyContinue -ErrorVariable +probeErrors | Out-String
            $probeErrorText = $probeErrors | Out-String
            $report.getVolume.status = if ($job.State -eq 'Completed') { 0 } else { 1 }
            $report.getVolume.stdout = $probeOutput.Substring(0, [Math]::Min($probeOutput.Length, 16384))
            $report.getVolume.stderr = $probeErrorText.Substring(0, [Math]::Min($probeErrorText.Length, 16384))
            if ($report.getVolume.status -ne 0) {
              throw "GET_VOLUME_ERROR: status=$($report.getVolume.status) stderr=$($report.getVolume.stderr)"
            }
            $volumes = @($probeOutput | ConvertFrom-Json)
            if ($volumes.Count -gt 0) {
              $report.drive = [string]$volumes[0].DriveLetter
              $report.fileSystem = [string]$volumes[0].FileSystem
              $report.driveType = [string]$volumes[0].DriveType
            }
            foreach ($volume in @($volumes | Sort-Object DriveLetter)) {
              if (
                [string]$volume.FileSystem -ne 'NTFS' -or
                [string]$volume.DriveType -ne 'Fixed' -or
                [string]::IsNullOrWhiteSpace([string]$volume.DriveLetter)
              ) { continue }
              $candidate = "{0}:\codegraph-gate-{1}-{2}" -f $volume.DriveLetter, $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
              try {
                New-Item -ItemType Directory -Force -Path $candidate | Out-Null
                $item = Get-Item -LiteralPath $candidate -Force
                $ordinary = [bool]$item.PSIsContainer
                $reparse = [bool]($item.Attributes -band [IO.FileAttributes]::ReparsePoint)
                $report.root.ordinary = $ordinary
                $report.root.reparse = $reparse
                if (-not $ordinary -or $reparse) { continue }
                $report.selectedRoot = [IO.Path]::GetFullPath($item.FullName)
                $report.drive = [string]$volume.DriveLetter
                $report.fileSystem = [string]$volume.FileSystem
                $report.driveType = [string]$volume.DriveType
                break
              } catch {
                $report.getVolume.stderr = ($report.getVolume.stderr + " root-probe=" + $_.Exception.Message).Substring(0, [Math]::Min(($report.getVolume.stderr + " root-probe=" + $_.Exception.Message).Length, 16384))
              }
            }
            if ([string]::IsNullOrWhiteSpace([string]$report.selectedRoot)) {
              throw "NO_SAFE_NTFS_VOLUME: FileSystem=$($report.fileSystem) DriveType=$($report.driveType)"
            }
          } catch {
            $failure = $_.Exception.Message
          } finally {
            if ($null -ne $job) {
              Stop-Job -Job $job -ErrorAction SilentlyContinue
              Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
            }
            $report.probeDurationMs = [Math]::Max(0, [int]((Get-Date) - $startedAt).TotalMilliseconds)
            $report | ConvertTo-Json -Depth 6 -Compress | Out-File -LiteralPath $artifactPath -Encoding utf8
          }
          if ($null -ne $failure) { throw $failure }
          "ARTIFACT_DIRECTORY=$artifactDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_TEMP=$($report.selectedRoot)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$($report.selectedRoot)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$($report.selectedRoot)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMPDIR=$($report.selectedRoot)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WIN32_PREFLIGHT_ARTIFACT=$artifactPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Install checksum-pinned pnpm Win32 release
        env:
          PNPM_ARCHIVE_SHA256: 7ac25ba81b8a9f213a307ae89198ba7e636e6c74fa0d775d554ba46e0187358b # pnpm v11.12.0 官方 Win32 x64 release asset 摘要
          PNPM_ARCHIVE_URL: https://github.com/pnpm/pnpm/releases/download/v11.12.0/pnpm-win32-x64.zip
          PNPM_ENTRY_SHA256: 0a8b6b9d6f391bb83e868a3f951eec74fb8f745c176fce523a9359f40b20fb7b
          PNPM_ENTRY_SIZE: '98099528'
        shell: pwsh
        run: |
          $archive = Join-Path $env:GATE_TEMP 'pnpm-win32-x64-11.12.0.zip'
          $trustedRoot = Join-Path $env:GATE_TEMP 'trusted-pnpm'
          try {
            curl.exe --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --retry 3 --show-error --silent --output $archive $env:PNPM_ARCHIVE_URL
            if ($LASTEXITCODE -ne 0) { throw 'pnpm Win32 release 下载失败。' }
            $actualArchiveSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($actualArchiveSha -ne $env:PNPM_ARCHIVE_SHA256) { throw 'pnpm Win32 release 摘要不匹配。' }

            & node trusted-harness/bin/install-trusted-pnpm-win32.mjs --archive $archive --trusted-root $trustedRoot
            if ($LASTEXITCODE -ne 0) { throw 'pnpm Win32 安全安装失败。' }
            $trustedPnpm = Join-Path $trustedRoot 'pnpm.exe'
            $trustedItem = Get-Item -LiteralPath $trustedPnpm
            if (
              -not $trustedItem.Exists -or
              $trustedItem.Length -ne [int64]$env:PNPM_ENTRY_SIZE -or
              ($trustedItem.Attributes -band [IO.FileAttributes]::ReparsePoint)
            ) {
              throw 'pnpm.exe 不是固定大小的普通文件。'
            }
            $actualEntrySha = (Get-FileHash -Algorithm SHA256 -LiteralPath $trustedPnpm).Hash.ToLowerInvariant()
            if ($actualEntrySha -ne $env:PNPM_ENTRY_SHA256) { throw 'pnpm.exe 固定摘要不匹配。' }
            $pnpmVersion = & $trustedPnpm --version
            if ($LASTEXITCODE -ne 0 -or $pnpmVersion.Trim() -ne '11.12.0') { throw '可信 pnpm 版本无效。' }
            "TRUSTED_PNPM_EXE=$trustedPnpm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            $sentinelRoot = Join-Path $env:GATE_TEMP 'path-sentinel'
            $sentinelMarker = Join-Path $sentinelRoot 'invoked.marker'
            New-Item -ItemType Directory -Force -Path $sentinelRoot | Out-Null
            "@echo off`r`necho invoked>`"$sentinelMarker`"`r`nexit /b 97`r`n" | Out-File -LiteralPath (Join-Path $sentinelRoot 'pnpm.cmd') -Encoding ascii
            "Set-Content -LiteralPath '$($sentinelMarker.Replace("'", "''"))' -Value invoked; exit 97" | Out-File -LiteralPath (Join-Path $sentinelRoot 'pnpm.ps1') -Encoding utf8
            "PATH_SENTINEL_MARKER=$sentinelMarker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PATH_SENTINEL_ROOT=$sentinelRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PATH=$sentinelRoot;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          }

      - name: Install frozen dependencies without candidate lifecycle
        shell: pwsh
        run: |
          $trustedPnpm = $env:TRUSTED_PNPM_EXE
          if (-not [IO.Path]::IsPathFullyQualified($trustedPnpm)) { throw '可信 pnpm 路径不是绝对路径。' }
          $pnpmVersion = & $trustedPnpm --version
          if ($LASTEXITCODE -ne 0 -or $pnpmVersion.Trim() -ne '11.12.0') { throw '可信 pnpm 版本无效。' }
          $candidateRoot = (Resolve-Path -LiteralPath 'candidate').Path
          $candidateHead = (& git -C $candidateRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateHead -ne '${{ inputs.head_oid }}') { throw '候选 checkout 未绑定 head_oid。' }
          & $trustedPnpm --dir $candidateRoot install --frozen-lockfile --ignore-pnpmfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw '候选依赖安装失败。' }
          & git -C $candidateRoot diff --quiet --no-ext-diff HEAD --
          if ($LASTEXITCODE -ne 0) { throw '候选 tracked 文件在安装期间发生漂移。' }

          $artifactDirectory = $env:ARTIFACT_DIRECTORY
          $gateHome = Join-Path $env:GATE_TEMP 'gatecandidate-home'
          $gateTemp = $env:GATE_TEMP
          $harnessHome = Join-Path $env:GATE_TEMP 'trusted-harness-home'
          New-Item -ItemType Directory -Force -Path $artifactDirectory, $gateHome, $gateTemp, $harnessHome | Out-Null
          "CANDIDATE_ROOT=$candidateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_HOME=$gateHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GATE_TEMP=$gateTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HARNESS_HOME=$harnessHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HOST_PATH_INVOCATION_ATTESTATION=$(Join-Path $artifactDirectory 'host-path-invocation.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH_RUNTIME_ATTESTATION=$(Join-Path $artifactDirectory 'win32-path-runtime.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact ordered workspace closure for Win32 gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedPnpm = $env:TRUSTED_PNPM_EXE
          $candidateRoot = $env:CANDIDATE_ROOT
          if (-not [IO.Path]::IsPathFullyQualified($trustedPnpm)) { throw '可信 pnpm 路径不是绝对路径。' }
          if (-not [IO.Path]::IsPathFullyQualified($candidateRoot)) { throw '候选根路径不是绝对路径。' }

          function Invoke-TrustedPnpm {
            param([string[]]$Arguments)
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $trustedPnpm
            $startInfo.WorkingDirectory = $candidateRoot
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in $Arguments) {
              $startInfo.ArgumentList.Add($argument)
            }
            $startInfo.Environment['CI'] = 'true'
            $startInfo.Environment['npm_config_enable_pre_post_scripts'] = 'false'
            $startInfo.Environment['npm_config_ignore_pnpmfile'] = 'true'
            $startInfo.Environment['npm_config_verify_deps_before_run'] = 'false'
            $startInfo.Environment['PNPM_CONFIG_ENABLE_PRE_POST_SCRIPTS'] = 'false'
            $startInfo.Environment['PNPM_CONFIG_IGNORE_PNPMFILE'] = 'true'
            $startInfo.Environment['PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN'] = 'false'
            $startInfo.Environment.Remove('npm_execpath')
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) { throw '可信 pnpm 进程未启动。' }
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            if ($process.ExitCode -ne 0) {
              throw "可信 pnpm 构建失败，exit=$($process.ExitCode)`n$stdout`n$stderr"
            }
          }

          # 该顺序从 Win32 host identity gate 的真实 imports 反向闭合，禁止退回单包 bootstrap。
          $buildClosure = @(
            [ordered]@{
              Name = '@codegraph/domain'
              PackageJson = 'packages/domain/package.json'
              Project = 'packages/domain/tsconfig.build.json'
              Outputs = @('packages/domain/dist/index.js', 'packages/domain/dist/index.d.ts')
            },
            [ordered]@{
              Name = '@codegraph/contracts'
              PackageJson = 'packages/contracts/package.json'
              Project = 'packages/contracts/tsconfig.build.json'
              Outputs = @('packages/contracts/dist/index.js', 'packages/contracts/dist/index.d.ts')
            },
            [ordered]@{
              Name = '@codegraph/application'
              PackageJson = 'packages/application/package.json'
              Project = 'packages/application/tsconfig.build.json'
              Outputs = @('packages/application/dist/index.js', 'packages/application/dist/index.d.ts')
            },
            [ordered]@{
              Name = '@codegraph/service-client'
              PackageJson = 'packages/service-client/package.json'
              Project = 'packages/service-client/tsconfig.build.json'
              Outputs = @('packages/service-client/dist/index.js', 'packages/service-client/dist/index.d.ts')
            },
            [ordered]@{
              Name = '@codegraph/adapter-analyzer-typescript'
              PackageJson = 'packages/adapters/analyzer-typescript/package.json'
              Project = 'packages/adapters/analyzer-typescript/tsconfig.build.json'
              Outputs = @('packages/adapters/analyzer-typescript/dist/index.js', 'packages/adapters/analyzer-typescript/dist/index.d.ts')
            },
            [ordered]@{
              Name = '@codegraph/adapter-git-local'
              PackageJson = 'packages/adapters/git-local/package.json'
              Project = 'packages/adapters/git-local/tsconfig.build.json'
              Outputs = @('packages/adapters/git-local/dist/index.js', 'packages/adapters/git-local/dist/index.d.ts')
            },
            [ordered]@{
              Name = '@codegraph/adapter-host-path-posix-native'
              PackageJson = 'packages/adapters/host-path-posix-native/package.json'
              Project = 'packages/adapters/host-path-posix-native/tsconfig.build.json'
              Outputs = @(
                'packages/adapters/host-path-posix-native/dist/index.js',
                'packages/adapters/host-path-posix-native/dist/index.d.ts',
                'packages/adapters/host-path-posix-native/dist/linux-helper.js',
                'packages/adapters/host-path-posix-native/dist/linux-helper.d.ts'
              )
            },
            [ordered]@{
              Name = '@codegraph/adapter-store-sqlite'
              PackageJson = 'packages/adapters/store-sqlite/package.json'
              Project = 'packages/adapters/store-sqlite/tsconfig.build.json'
              Outputs = @('packages/adapters/store-sqlite/dist/index.js', 'packages/adapters/store-sqlite/dist/index.d.ts')
            },
            [ordered]@{
              Name = '@codegraph/graph-service'
              PackageJson = 'apps/graph-service/package.json'
              Project = 'apps/graph-service/tsconfig.build.json'
              Outputs = @(
                'apps/graph-service/dist/index.js',
                'apps/graph-service/dist/index.d.ts',
                'apps/graph-service/dist/main.js'
              )
            }
          )
          foreach ($build in $buildClosure) {
            $packagePath = Join-Path $candidateRoot $build.PackageJson
            $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
            if ($package.name -ne $build.Name) { throw "workspace package identity 漂移：$($build.Name)" }
            foreach ($lifecycle in @('preinstall', 'install', 'postinstall')) {
              if ($null -ne $package.scripts.$lifecycle) {
                throw "候选安装 lifecycle 未保持禁用：$($build.Name)/$lifecycle"
              }
            }
            $pnpmArguments = @(
              '--dir', $candidateRoot,
              'exec', 'tsc',
              '-p', $build.Project,
              '--pretty', 'false'
            )
            Invoke-TrustedPnpm -Arguments $pnpmArguments
            foreach ($relativeOutput in $build.Outputs) {
              $outputPath = Join-Path $candidateRoot $relativeOutput
              $item = Get-Item -LiteralPath $outputPath -Force
              if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                throw "构建输出不是普通非 reparse 文件：$relativeOutput"
              }
            }
            $distRoot = Split-Path -Parent (Join-Path $candidateRoot $build.Outputs[0])
            foreach ($item in Get-ChildItem -LiteralPath $distRoot -Recurse -Force) {
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "构建输出树包含 reparse 节点：$($item.FullName)"
              }
            }
            & git -C $candidateRoot diff --quiet --no-ext-diff HEAD --
            if ($LASTEXITCODE -ne 0) { throw "workspace 构建造成 tracked 漂移：$($build.Name)" }
            if (Test-Path -LiteralPath $env:PATH_SENTINEL_MARKER) {
              throw "恶意 PATH pnpm sentinel 被调用：$($build.Name)"
            }
          }

      - name: Revalidate trusted pnpm launcher for evidence
        env:
          PNPM_ENTRY_SHA256: 0a8b6b9d6f391bb83e868a3f951eec74fb8f745c176fce523a9359f40b20fb7b
          PNPM_ENTRY_SIZE: '98099528'
        shell: pwsh
        run: |
          $trustedPnpm = $env:TRUSTED_PNPM_EXE
          if (
            -not [IO.Path]::IsPathFullyQualified($trustedPnpm) -or
            [IO.Path]::GetFileName($trustedPnpm) -ine 'pnpm.exe' -or
            -not [IO.File]::Exists($trustedPnpm)
          ) {
            throw '可信 pnpm launcher 不是绝对本地 pnpm.exe。'
          }
          $trustedItem = Get-Item -LiteralPath $trustedPnpm -Force
          if (
            $trustedItem.PSIsContainer -or
            $trustedItem.Length -ne [int64]$env:PNPM_ENTRY_SIZE -or
            ($trustedItem.Attributes -band [IO.FileAttributes]::ReparsePoint)
          ) {
            throw '可信 pnpm launcher 不是固定大小的普通非 reparse 文件。'
          }
          $resolvedTrustedPnpm = (Resolve-Path -LiteralPath $trustedPnpm).Path
          if (-not [IO.Path]::GetFullPath($resolvedTrustedPnpm).Equals(
            [IO.Path]::GetFullPath($trustedPnpm),
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw '可信 pnpm launcher 经解析后发生重定向。'
          }
          $actualEntrySha = (Get-FileHash -Algorithm SHA256 -LiteralPath $trustedPnpm).Hash.ToLowerInvariant()
          if ($actualEntrySha -ne $env:PNPM_ENTRY_SHA256) { throw '可信 pnpm launcher SHA-256 漂移。' }
          $pnpmVersion = & $trustedPnpm --version
          if ($LASTEXITCODE -ne 0 -or $pnpmVersion.Trim() -ne '11.12.0') { throw '可信 pnpm launcher 版本漂移。' }
          Remove-Item Env:npm_execpath -ErrorAction SilentlyContinue
          $commands = @(Get-Command pnpm -All -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object {
            $commandPath = if ([string]::IsNullOrWhiteSpace([string]$_.Path)) { [string]$_.Source } else { [string]$_.Path }
            [ordered]@{
              commandType = [string]$_.CommandType
              path = if ([string]::IsNullOrWhiteSpace($commandPath)) { '' } else { [IO.Path]::GetFullPath($commandPath) }
            }
          })
          [ordered]@{
            schemaVersion = 1
            processPlatform = 'win32'
            npmExecPathAbsent = -not (Test-Path Env:npm_execpath)
            trustedExecutable = [IO.Path]::GetFullPath($trustedPnpm)
            trustedExecutableSha256 = $actualEntrySha
            trustedExecutableSize = [int64]$trustedItem.Length
            trustedExecutableVersion = $pnpmVersion.Trim()
            getCommandPnpmAll = $commands
            sentinelMarker = $env:PATH_SENTINEL_MARKER
          } | ConvertTo-Json -Depth 5 -Compress | Out-File -LiteralPath $env:PATH_RUNTIME_ATTESTATION -Encoding utf8

      - name: Produce Win32 host identity evidence
        env:
          BASE_OID: ${{ inputs.base_oid }}
          HEAD_OID: ${{ inputs.head_oid }}
          OBJECT_FORMAT: ${{ inputs.object_format }}
          PULL_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
          PRODUCER_WORKFLOW_SHA: ${{ inputs.producer_workflow_sha }}
          PROVIDER_REPOSITORY_ID: ${{ inputs.provider_repository_id }}
        shell: pwsh
        run: |
          $arguments = @(
            'trusted-harness/bin/produce-gate-evidence.mjs',
            '--artifact-directory', $env:ARTIFACT_DIRECTORY,
            '--base-oid', $env:BASE_OID,
            '--candidate-root', $env:CANDIDATE_ROOT,
            '--controller-repository', 'Rockyyy-S/code-graph-gate-controller',
            '--execution-partition', 'win32',
            '--gate-home', $env:GATE_HOME,
            '--gate-temp-directory', $env:GATE_TEMP,
            '--harness-contract-version', '4',
            '--head-oid', $env:HEAD_OID,
            '--host-path-invocation-attestation', $env:HOST_PATH_INVOCATION_ATTESTATION,
            '--object-format', $env:OBJECT_FORMAT,
            '--path-sentinel-marker', $env:PATH_SENTINEL_MARKER,
            '--provider-repository-id', $env:PROVIDER_REPOSITORY_ID,
            '--proposed-record-directory', (Join-Path $env:GITHUB_WORKSPACE 'trusted-state/trusted/proposed'),
            '--pull-number', $env:PULL_NUMBER,
            '--trusted-record', (Join-Path $env:GITHUB_WORKSPACE 'trusted-state/trusted/registry.json'),
            '--trusted-pnpm-executable', $env:TRUSTED_PNPM_EXE,
            '--win32-preflight-artifact', $env:WIN32_PREFLIGHT_ARTIFACT,
            '--workflow-file', 'produce-gate-evidence.yml',
            '--workflow-sha', $env:PRODUCER_WORKFLOW_SHA
          )
          $previousHome = $env:HOME
          try {
            $env:HOME = $env:HARNESS_HOME
            & node @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Win32 host identity blocking gate 失败。' }
            if (Test-Path -LiteralPath $env:PATH_SENTINEL_MARKER) { throw '恶意 PATH pnpm sentinel 被调用。' }
          } finally {
            $env:HOME = $previousHome
          }

      - name: Reject empty Win32 host identity test collection
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:ARTIFACT_DIRECTORY 'gate-evidence.json'
          $stdoutPath = Join-Path $env:ARTIFACT_DIRECTORY 'host-path-identity-win32-v1.stdout.log'
          if (-not (Test-Path -LiteralPath $evidencePath) -or -not (Test-Path -LiteralPath $stdoutPath)) {
            throw 'Win32 host identity evidence 或测试日志缺失。'
          }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $gate = @($evidence.evidence | Where-Object { $_.gateId -eq 'host-path-identity-win32-v1' })
          if ($gate.Count -ne 1 -or $gate[0].status -ne 'pass') {
            throw 'Win32 host identity gate 未成功。'
          }
          $stdout = Get-Content -LiteralPath $stdoutPath -Raw
          $plain = [regex]::Replace($stdout, "`e\[[0-9;]*m", '')
          if ($plain -match '(?im)\(\s*0 tests?\s*\)|\bno tests\b') {
            throw 'Win32 host identity gate 不接受 0 tests。'
          }
          if ($plain -notmatch '(?im)\bTests\s+[1-9][0-9]*\s+passed\b') {
            throw 'Win32 host identity gate 未证明执行了非零测试。'
          }

      - name: Upload unsigned Win32 evidence
        if: ${{ always() && hashFiles('artifacts-win32/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 固定 v4 提交
        with:
          if-no-files-found: error
          name: gate-evidence-win32-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.head_oid }}
          path: artifacts-win32/
          retention-days: 1

  gate-evidence:
    name: gate-evidence
    needs:
      - gate-execution
      - gate-execution-win32
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable GateHarness for clean merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # 固定 v4 提交
        with:
          fetch-depth: 1
          path: trusted-harness
          persist-credentials: false
          ref: f03e200280d8da8bdd474abe01b9ef2e90f3a631
          repository: Rockyyy-S/code-graph-gate-controller

      - name: Download portable unsigned evidence into a clean runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # 固定 v4 提交
        with:
          name: gate-evidence-portable-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.head_oid }}
          path: partial/portable

      - name: Download Win32 unsigned evidence into a clean runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # 固定 v4 提交
        with:
          name: gate-evidence-win32-raw-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.head_oid }}
          path: partial/win32

      - name: Merge platform evidence with immutable GateHarness
        shell: bash
        run: |
          install -d -m 0700 artifacts trusted-harness-home
          portable_artifact="$PWD/partial/portable/gate-evidence.json"
          win32_artifact="$PWD/partial/win32/gate-evidence.json"
          [[ -f "$portable_artifact" && -f "$win32_artifact" ]]
          input_artifacts_json="$(node --input-type=module --eval 'console.log(JSON.stringify(process.argv.slice(1)))' "$portable_artifact" "$win32_artifact")"
          env -i HOME="$PWD/trusted-harness-home" LANG=C.UTF-8 PATH="$PATH" node trusted-harness/bin/produce-gate-evidence.mjs merge \
            --artifact-directory "$PWD/artifacts" \
            --input-artifacts-json "$input_artifacts_json"
          find partial/portable partial/win32 -maxdepth 1 -type f ! -name gate-evidence.json -exec cp -- {} artifacts/ \;

      - name: Attest exact evidence artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # 固定 v4 提交
        with:
          subject-path: artifacts/gate-evidence.json

      - name: Upload child evidence and bounded logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 固定 v4 提交
        with:
          if-no-files-found: error
          name: gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.head_oid }}
          path: artifacts/
          retention-days: 14
